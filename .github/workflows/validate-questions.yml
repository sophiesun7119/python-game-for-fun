name: Validate Python Quest questions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify runnable question outputs with CPython
        run: python3 tests/validate_python.py
      - name: Verify all trace snapshots and answers
        run: node tests/validate-traces.mjs
      - name: Verify walkthrough arrows follow actual function calls and returns
        run: node tests/validate-trace-control-flow.mjs
      - name: Verify condition badges and loop decisions
        run: node tests/validate-trace-decisions.mjs
      - name: Verify inline variable snapshots and check/cross indicators
        run: node tests/validate-inline-trace.mjs
      - name: Verify variable lifetime and latest-assignment placement
        run: node tests/validate-trace-scopes.mjs
      - name: Verify semantic function and output event consistency
        run: node tests/validate-trace-events.mjs
